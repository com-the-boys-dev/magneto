:root{--bg:#0d0a09;--panel:#1a1311;--ink:#f1e4cf;--muted:#a8927a;--red:#a8121a;--red2:#d42a30;--line:#6e1d1d;--cream:#f1e4cf;--shadow:rgba(212,42,48,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eadcbc;--panel:#f6ecd4;--ink:#1a0f0c;--muted:#6b5640;--red:#9a1017;--red2:#7d0b11;--line:#a9573f;--cream:#f6ecd4;--shadow:rgba(122,11,17,.3);color-scheme:light}}
:root[data-theme="light"]{--bg:#eadcbc;--panel:#f6ecd4;--ink:#1a0f0c;--muted:#6b5640;--red:#9a1017;--red2:#7d0b11;--line:#a9573f;--cream:#f6ecd4;--shadow:rgba(122,11,17,.3);color-scheme:light}
:root[data-theme="dark"]{--bg:#0d0a09;--panel:#1a1311;--ink:#f1e4cf;--muted:#a8927a;--red:#a8121a;--red2:#d42a30;--line:#6e1d1d;--cream:#f1e4cf;--shadow:rgba(212,42,48,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Special Elite','Courier New',Courier,monospace}
header{padding:26px 22px 16px;border-bottom:4px double var(--red);background:var(--panel)}
header p{margin:0 0 2px;font-size:14px;color:var(--muted)}
header h1{margin:0;font:400 clamp(34px,7vw,64px)/1 'Chinese Rocks','Impact',sans-serif;letter-spacing:2px;color:var(--red2);text-shadow:2px 2px 0 var(--shadow)}
header h2{margin:8px 0 0;font:400 14px 'Special Elite','Courier New',monospace;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar button{font:400 16px 'Chinese Rocks','Impact',sans-serif;letter-spacing:1px;border:2px solid var(--red);background:transparent;color:var(--ink);padding:6px 14px;border-radius:3px;cursor:pointer}
.bar button:hover,.bar button:focus-visible{background:var(--red);color:var(--cream);outline:none}
#theme{margin-left:auto;background:var(--red);color:var(--cream)}
#theme:hover,#theme:focus-visible{background:var(--red2)}
.legend{width:100%;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid var(--red)}
.wrap{overflow:auto;padding:26px 22px 60px;max-width:100%}
.tree ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tree li{display:flex;align-items:center;position:relative;padding:5px 0 5px 30px}
.tree li::before{content:"";position:absolute;left:0;top:50%;width:30px;border-top:2px solid var(--line)}
.tree li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.tree li:first-child::after{top:50%}
.tree li:last-child::after{bottom:50%}
.tree li:only-child::after{display:none}
.tree>ul>li{padding-left:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li.closed>ul{display:none}
.box{display:flex;align-items:center;gap:10px;border-radius:4px;padding:8px 10px 8px 14px;font:400 13px/1.35 'Special Elite','Courier New',monospace;white-space:nowrap;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.box b{font:400 17px/1.15 'Chinese Rocks','Impact',sans-serif;letter-spacing:.8px}
.box small{display:block;font-size:11px;opacity:.8;margin-top:2px}
.l0{background:var(--red);color:#f1e4cf;border:3px double #f1e4cf;padding:14px 18px;white-space:normal;max-width:220px;box-shadow:0 0 0 3px var(--red),0 8px 22px var(--shadow)}
.l0 b{font-size:28px;letter-spacing:1.5px}
.l1{background:var(--red);color:#f1e4cf;border-color:var(--red2)}
.l1 b{font-size:20px}
.l2{border-color:var(--red)}
.leaf{font-size:12px}
.leaf.v{border-left:5px solid var(--red2)}
.leaf.x{border-style:dashed;border-color:var(--red2)}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--red2);background:var(--bg);color:var(--ink);font:400 14px 'Chinese Rocks','Impact',sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}
.l0 .dot,.l1 .dot{border-color:#f1e4cf;background:#0d0a09;color:#f1e4cf}
.dot:hover,.dot:focus-visible{background:var(--red2);color:#f1e4cf;outline:none}
@media (prefers-reduced-motion:no-preference){.tree li>ul{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>

const root=document.getElementById('tree');
function build(n,d){
 const li=document.createElement('li');
 const isStr=typeof n==='string';
 const label=isStr?n:n.l;
 const kids=isStr?[]:n.k;
 const [main,sub]=label.split('|');
 const star=main.startsWith('★');
 const box=document.createElement('div');
 box.className='box '+(d===0?'l0':d===1?'l1':d===2?'l2':'leaf')+((star||(isStr&&label.startsWith('★')))?' x':'')+((isStr&&label.startsWith('▶'))?' v':'');
 box.innerHTML='<span><b></b>'+(sub?'<small></small>':'')+'</span>';
 box.querySelector('b').textContent=main;
 if(sub)box.querySelector('small').textContent=sub;
 if(d===0)box.querySelector('b').style.fontWeight=700;
 li.appendChild(box);
 if(kids.length){
  const ul=document.createElement('ul');
  kids.forEach(k=>ul.appendChild(build(k,d+1)));
  li.appendChild(ul);
  const b=document.createElement('button');
  b.className='dot';b.type='button';
  const sync=()=>{const c=li.classList.contains('closed');b.textContent=c?kids.length:'−';b.setAttribute('aria-expanded',!c);b.setAttribute('aria-label',(c?'Expand ':'Collapse ')+main)};
  b.onclick=()=>{li.classList.toggle('closed');sync()};
  li._sync=sync;
  box.appendChild(b);
  if(d>=2)li.classList.add('closed');
  sync();
 }
 return li;
}
const ul=document.createElement('ul');ul.appendChild(build(D,0));root.appendChild(ul);
const all=()=>root.querySelectorAll('li');
function setAll(open,maxDepth){
 all().forEach(li=>{if(!li._sync)return;
  let d=0,p=li;while(p=p.parentElement.closest('li'))d++;
  li.classList.toggle('closed',open?(maxDepth!=null&&d>=maxDepth):d>0);li._sync();});
}
document.getElementById('exp').onclick=()=>setAll(true);
document.getElementById('col').onclick=()=>setAll(false);
document.getElementById('lvl').onclick=()=>setAll(true,2);

const rootEl=document.documentElement,tb=document.getElementById('theme');
const cur=()=>rootEl.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
const paint=()=>{tb.textContent=cur()==='dark'?'Light mode':'Dark mode'};
try{const s=localStorage.getItem('magneto-theme');if(s==='light'||s==='dark')rootEl.setAttribute('data-theme',s)}catch(e){}
paint();
tb.onclick=()=>{const n=cur()==='dark'?'light':'dark';rootEl.setAttribute('data-theme',n);try{localStorage.setItem('magneto-theme',n)}catch(e){}paint()};
</script>
